version: '3.8'

networks:
  dlstreamer_net:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper_dlstreamer
    networks:
      - dlstreamer_net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka_dlstreamer
    networks:
      - dlstreamer_net
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: rtsp_server
    networks:
      - dlstreamer_net
    ports:
      - "8554:8554"
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8554 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  cam0-feeder:
    image: jrottenberg/ffmpeg:latest
    container_name: cam0_feeder
    networks:
      - dlstreamer_net
    depends_on:
      rtsp-server:
        condition: service_healthy
    volumes:
      - ./videos:/videos:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 10 &&
      ffmpeg -re -stream_loop -1 -i /videos/cam0_h264.mp4
      -c copy -f rtsp rtsp://rtsp-server:8554/cam0"
    restart: unless-stopped

  cam2-feeder:
    image: jrottenberg/ffmpeg:latest
    container_name: cam2_feeder
    networks:
      - dlstreamer_net
    depends_on:
      rtsp-server:
        condition: service_healthy
    volumes:
      - ./videos:/videos:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 15 &&
      ffmpeg -re -stream_loop -1 -i /videos/cam2_h264.mp4
      -c copy -f rtsp rtsp://rtsp-server:8554/cam2"
    restart: unless-stopped

  cam4-feeder:
    image: jrottenberg/ffmpeg:latest
    container_name: cam4_feeder
    networks:
      - dlstreamer_net
    depends_on:
      rtsp-server:
        condition: service_healthy
    volumes:
      - ./videos:/videos:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 20 &&
      ffmpeg -re -stream_loop -1 -i /videos/cam4_h264.mp4
      -c copy -f rtsp rtsp://rtsp-server:8554/cam4"
    restart: unless-stopped

  cam6-feeder:
    image: jrottenberg/ffmpeg:latest
    container_name: cam6_feeder
    networks:
      - dlstreamer_net
    depends_on:
      rtsp-server:
        condition: service_healthy
    volumes:
      - ./videos:/videos:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 25 &&
      ffmpeg -re -stream_loop -1 -i /videos/cam6_h264.mp4
      -c copy -f rtsp rtsp://rtsp-server:8554/cam6"
    restart: unless-stopped

  dlstreamer:
    build: .
    container_name: dlstreamer_arc
    networks:
      - dlstreamer_net
    depends_on:
      kafka:
        condition: service_healthy
      rtsp-server:
        condition: service_healthy
    volumes:
      - ./scripts:/home/dlstreamer/scripts:ro
      - ./models:/home/dlstreamer/models:ro
      - ./videos:/home/dlstreamer/videos:ro
      - ./benchmark_results:/benchmark_results:rw
      - /dev/dri:/dev/dri
      - /var/run/docker.sock:/var/run/docker.sock
    devices:
      - /dev/dri:/dev/dri
    privileged: true
    environment:
      - LIBVA_DEVICE=/dev/dri/renderD129
      - GST_VAAPI_DRM_DEVICE=/dev/dri/renderD129
      - LIBVA_DRIVER_NAME=iHD
      - GPU_DEVICE_ORDINAL=1
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "sleep 60 &&
      /home/dlstreamer/scripts/process_video.sh 
      --cameras cam0,cam2,cam4,cam6 
      --detection-model /home/dlstreamer/models/detection_model/FP32/det.xml 
      --pose-model /home/dlstreamer/models/public/yolo11s-pose/FP32/yolo11s-pose.xml 
      --kafka-broker kafka:9092 
      --kafka-topic dlstreamer-output"
    restart: unless-stopped

  benchmark-monitor:
    build: .
    container_name: benchmark_monitor
    networks:
      - dlstreamer_net
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./benchmark_results:/benchmark_results:rw
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "sleep 70 &&
      python3 /home/dlstreamer/scripts/benchmark_monitor.py 
      --kafka-broker kafka:9092 
      --kafka-topic dlstreamer-output 
      --output-dir /benchmark_results"
    restart: unless-stopped

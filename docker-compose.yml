version: '3.8'

services:
  # ============================================
  # RTSP SERVER
  # ============================================
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: rtsp-server
    ports:
      - "8554:8554"
      - "8888:8888"
    networks:
      - dlstreamer_net
    restart: unless-stopped
    environment:
      - MTX_API=yes
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/v1/config/get"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # SINGLE CAMERA FEEDER (cam0 only)
  # ============================================
  cam0-feeder:
    image: jrottenberg/ffmpeg:5.1-alpine
    container_name: cam0-feeder
    volumes:
      - ./videos:/videos:ro
    networks:
      - dlstreamer_net
    depends_on:
      rtsp-server:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo 'Waiting for RTSP server...' &&
      sleep 10 &&
      echo 'Checking video file...' &&
      ls -lh /videos/cam0_h264.mp4 &&
      echo 'Starting cam0 stream...' &&
      ffmpeg -re -stream_loop -1 
      -i /videos/cam0_h264.mp4
      -c:v copy
      -f rtsp
      -rtsp_transport tcp
      rtsp://rtsp-server:8554/cam0"

  # ============================================
  # KAFKA
  # ============================================
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper_dlstreamer
    ports:
      - "2181:2181"
    networks:
      - dlstreamer_net
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka_dlstreamer
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CREATE_TOPICS=dlstreamer-output:1:1
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
    volumes:
      - kafka_data:/kafka
    depends_on:
      - zookeeper
    networks:
      - dlstreamer_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================
  # DLSTREAMER (Single stream, single model)
  # ============================================
  dlstreamer:
    build: .
    container_name: dlstreamer_arc
    volumes:
      - ./scripts:/home/dlstreamer/scripts
      - ./videos:/home/dlstreamer/videos
      - ./models:/home/dlstreamer/models
      - ./benchmark_results:/benchmark_results
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      kafka:
        condition: service_healthy
      rtsp-server:
        condition: service_healthy
      cam0-feeder:
        condition: service_started
    networks:
      - dlstreamer_net
    restart: unless-stopped
    privileged: true
    environment:
      - KAFKA_BROKER=kafka:9092
      - LIBVA_DEVICE=/dev/dri/renderD129
      - GST_VAAPI_DRM_DEVICE=/dev/dri/renderD129
      - LIBVA_DRIVER_NAME=iHD
      - GST_VAAPI_ALL_DRIVERS=1
      - LIBVA_DRIVERS_PATH=/usr/lib/x86_64-linux-gnu/dri
      - GPU_DEVICE_ORDINAL=1
      - GST_DEBUG=2
      - DISPLAY=${DISPLAY:-:0}
    command: >
      bash -c "
      echo '========================================' &&
      echo '🚀 Intel Arc A770 - Single Stream Test' &&
      echo '========================================' &&
      echo '' &&
      echo '📊 Hardware Detection:' &&
      python3 /home/dlstreamer/scripts/device_detector.py --verbose &&
      echo '' &&
      echo '⏳ Waiting for stream...' &&
      sleep 30 &&
      echo '' &&
      echo '🎬 Launching SINGLE STREAM pipeline...' &&
      chmod +x /home/dlstreamer/scripts/process_video.sh &&
      /home/dlstreamer/scripts/process_video.sh 
      --video 'rtsp://rtsp-server:8554/cam0' 
      --tasks 'gvadetect' 
      --detect-model '/home/dlstreamer/models/detection_model/FP32/det.xml' 
      --camera-id 'cam0' 
      --device 'GPU.1'
      "

  # ============================================
  # BENCHMARK MONITOR
  # ============================================
  benchmark-monitor:
    image: python:3.9-slim
    container_name: benchmark_monitor
    volumes:
      - ./benchmark_results:/benchmark_results
      - ./scripts/benchmark_monitor.py:/app/benchmark_monitor.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev/dri:/dev/dri
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dlstreamer_net
    restart: unless-stopped
    privileged: true
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=dlstreamer-output
      - PYTHONUNBUFFERED=1
      - LIBVA_DRIVER_NAME=iHD
    command: >
      bash -c "
      echo '📊 Starting Benchmark Monitor' &&
      apt-get update -qq && apt-get install -y -qq procps netcat-openbsd > /dev/null 2>&1 &&
      pip install -q kafka-python psutil docker &&
      python /app/benchmark_monitor.py
      "

networks:
  dlstreamer_net:
    driver: bridge

volumes:
  kafka_data:

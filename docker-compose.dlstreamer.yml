# networks:
#   dlstreamer_shared_net:
#     external: true
services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper_dlstreamer
    ports:
      - "2181:2181"
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka
    container_name: kafka_dlstreamer
    ports:
      - "9092:9092"
    environment:
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_BROKER_ID=1
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CREATE_TOPICS=dlstreamer_output:4:1
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      retries: 5
      start_period: 20s

  # Universal Auto-Detection DLStreamer
  dlstreamer-auto:
    build: .
    container_name: dlstreamer_auto
    profiles: ["auto"]
    volumes:
      - ./scripts:/home/dlstreamer/scripts
      - ./videos:/home/dlstreamer/videos
      - ./models:/home/dlstreamer/models
      - ./benchmark_results:/benchmark_results
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/dri:/dev/dri
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped
    privileged: true
    environment:
      - KAFKA_BROKER=kafka:9092
      - GST_DEBUG=2
      - LIBVA_DRIVER_NAME=iHD
      - GST_VAAPI_ALL_DRIVERS=1
      - DISPLAY=${DISPLAY:-:0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      bash -c "
      echo 'Starting Universal Auto-Detection DLStreamer...' &&
      echo 'Hardware Detection Results:' &&
      echo '   VAAPI Support:' &&
      (vainfo 2>/dev/null | head -5 || echo '   No VAAPI support detected') &&
      echo '   NVIDIA GPU:' &&
      (nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null || echo '   No NVIDIA GPU detected') &&
      echo '   Starting pipeline in 15 seconds...' &&
      sleep 15 &&
      chmod +x /home/dlstreamer/scripts/process_video.sh &&
      /home/dlstreamer/scripts/process_video.sh 
      --video 'rtsp://rtsp-server:8554/cam0,rtsp://rtsp-server:8554/cam2,rtsp://rtsp-server:8554/cam4,rtsp://rtsp-server:8554/cam6' 
      --tasks 'gvadetect,gvapose' 
      --detect-model '/home/dlstreamer/models/detection_model/FP32/det.xml' 
      --pose-model '/home/dlstreamer/models/public/yolo11s-pose/FP32/yolo11s-pose.xml' 
      --camera-id 'cam0,cam2,cam4,cam6' 
      --device 'AUTO'
      --livestream 'true'
      "

  # CPU-only version
  dlstreamer-cpu:
    build: .
    container_name: dlstreamer_cpu
    profiles: ["cpu"]
    volumes:
      - ./scripts:/home/dlstreamer/scripts
      - ./videos:/home/dlstreamer/videos
      - ./models:/home/dlstreamer/models
      - ./benchmark_results:/benchmark_results
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped
    environment:
      - KAFKA_BROKER=kafka:9092
      - GST_DEBUG=2
    command: >
      bash -c "
      echo 'Starting CPU-only DLStreamer...' &&
      sleep 15 &&
      chmod +x /home/dlstreamer/scripts/process_video.sh &&
      /home/dlstreamer/scripts/process_video.sh 
      --video 'rtsp://rtsp-server:8554/cam0,rtsp://rtsp-server:8554/cam2,rtsp://rtsp-server:8554/cam4,rtsp://rtsp-server:8554/cam6' 
      --tasks 'gvadetect,gvapose' 
      --detect-model '/home/dlstreamer/models/detection_model/FP32/det.xml' 
      --pose-model '/home/dlstreamer/models/public/yolo11s-pose/FP32/yolo11s-pose.xml' 
      --camera-id 'cam0,cam2,cam4,cam6' 
      --device 'CPU'
      --livestream 'true'
      "

  # Enhanced Universal Benchmark Monitor
  benchmark-monitor:
    image: python:3.9-slim
    container_name: benchmark_monitor
    volumes:
      - ./benchmark_results:/benchmark_results
      - ./benchmark_monitor.py:/app/benchmark_monitor.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev/dri:/dev/dri
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped
    privileged: true
    environment:
      - KAFKA_BROKER=kafka:9092
      - PYTHONUNBUFFERED=1
      - LIBVA_DRIVER_NAME=iHD
      - GST_VAAPI_ALL_DRIVERS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      bash -c "
      echo 'Starting Universal Benchmark Monitor...' &&
      apt-get update && apt-get install -y procps vainfo mesa-va-drivers intel-media-va-driver netcat-openbsd &&
      pip install kafka-python psutil docker &&
      echo 'System Hardware Detection:' &&
      echo '   CPU Info:' &&
      (cat /proc/cpuinfo | grep 'model name' | head -1 || echo '   CPU info not available') &&
      echo '   Memory Info:' &&
      (free -h | head -2 || echo '   Memory info not available') &&
      echo '   GPU Detection:' &&
      (vainfo 2>/dev/null | head -3 || echo '   No VAAPI GPU detected') &&
      echo '   Starting monitoring...' &&
      python /app/benchmark_monitor.py
      "

networks:
  dlstreamer_shared_net:
    external: true

# networks:
#   dlstreamer_shared_net:
#     external: true

services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper_dlstreamer
    ports:
      - "2181:2181"
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka
    container_name: kafka_dlstreamer
    ports:
      - "9092:9092"
    environment:
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_BROKER_ID=1
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CREATE_TOPICS=dlstreamer_output:4:1
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      retries: 5
      start_period: 20s

  # Universal Auto-Detection DLStreamer (Intel Arc Optimized)
  dlstreamer-auto:
    build: .
    container_name: dlstreamer_auto
    profiles: ["auto"]
    volumes:
      - ./scripts:/home/dlstreamer/scripts
      - ./videos:/home/dlstreamer/videos
      - ./models:/home/dlstreamer/models
      - ./benchmark_results:/benchmark_results
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped
    privileged: true
    environment:
      - KAFKA_BROKER=kafka:9092
      - GST_DEBUG=2
      - LIBVA_DRIVER_NAME=iHD
      - GST_VAAPI_ALL_DRIVERS=1
      - LIBVA_DRIVERS_PATH=/usr/lib/x86_64-linux-gnu/dri
      - DISPLAY=${DISPLAY:-:0}
      - GST_VAAPI_DRM_DEVICE=/dev/dri/renderD129  # ✅ Force Arc A770
      - LIBVA_DEVICE=/dev/dri/renderD129           # ✅ Force Arc A770
    command: >
      bash -c "
      echo '========================================' &&
      echo '🚀 Starting Universal DLStreamer Pipeline' &&
      echo '========================================' &&
      echo '' &&
      echo '📊 Hardware Detection:' &&
      python3 /home/dlstreamer/scripts/device_detector.py --verbose &&
      echo '' &&
      echo '⏳ Waiting for Kafka to be ready...' &&
      sleep 15 &&
      echo '' &&
      echo '🎬 Launching video processing pipeline...' &&
      chmod +x /home/dlstreamer/scripts/process_video.sh &&
      /home/dlstreamer/scripts/process_video.sh 
      --video 'rtsp://rtsp-server:8554/cam0,rtsp://rtsp-server:8554/cam2,rtsp://rtsp-server:8554/cam4,rtsp://rtsp-server:8554/cam6' 
      --tasks 'gvadetect,gvapose' 
      --detect-model '/home/dlstreamer/models/detection_model/FP32/det.xml' 
      --pose-model '/home/dlstreamer/models/public/yolo11s-pose/FP32/yolo11s-pose.xml' 
      --camera-id 'cam0,cam2,cam4,cam6' 
      --device 'GPU.1'
      "

  # CPU-only version (fallback)
  dlstreamer-cpu:
    build: .
    container_name: dlstreamer_cpu
    profiles: ["cpu"]
    volumes:
      - ./scripts:/home/dlstreamer/scripts
      - ./videos:/home/dlstreamer/videos
      - ./models:/home/dlstreamer/models
      - ./benchmark_results:/benchmark_results
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped
    environment:
      - KAFKA_BROKER=kafka:9092
      - GST_DEBUG=2
    command: >
      bash -c "
      echo '🚀 Starting CPU-only DLStreamer...' &&
      sleep 15 &&
      chmod +x /home/dlstreamer/scripts/process_video.sh &&
      /home/dlstreamer/scripts/process_video.sh 
      --video 'rtsp://rtsp-server:8554/cam0,rtsp://rtsp-server:8554/cam2,rtsp://rtsp-server:8554/cam4,rtsp://rtsp-server:8554/cam6' 
      --tasks 'gvadetect,gvapose' 
      --detect-model '/home/dlstreamer/models/detection_model/FP32/det.xml' 
      --pose-model '/home/dlstreamer/models/public/yolo11s-pose/FP32/yolo11s-pose.xml' 
      --camera-id 'cam0,cam2,cam4,cam6' 
      --device 'CPU'
      --livestream 'true'
      "

  # Intel GPU-only version (explicit)
  dlstreamer-gpu:
    build: .
    container_name: dlstreamer_gpu
    profiles: ["gpu"]
    volumes:
      - ./scripts:/home/dlstreamer/scripts
      - ./videos:/home/dlstreamer/videos
      - ./models:/home/dlstreamer/models
      - ./benchmark_results:/benchmark_results
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped
    privileged: true
    environment:
      - KAFKA_BROKER=kafka:9092
      - GST_DEBUG=2
      - LIBVA_DRIVER_NAME=iHD
      - GST_VAAPI_ALL_DRIVERS=1
      - LIBVA_DRIVERS_PATH=/usr/lib/x86_64-linux-gnu/dri
    command: >
      bash -c "
      echo '🚀 Starting Intel GPU-accelerated DLStreamer...' &&
      echo '📊 Verifying Intel GPU access...' &&
      vainfo &&
      clinfo | grep 'Intel' &&
      sleep 15 &&
      chmod +x /home/dlstreamer/scripts/process_video.sh &&
      /home/dlstreamer/scripts/process_video.sh 
      --video 'rtsp://rtsp-server:8554/cam0,rtsp://rtsp-server:8554/cam2,rtsp://rtsp-server:8554/cam4,rtsp://rtsp-server:8554/cam6' 
      --tasks 'gvadetect,gvapose' 
      --detect-model '/home/dlstreamer/models/detection_model/FP32/det.xml' 
      --pose-model '/home/dlstreamer/models/public/yolo11s-pose/FP32/yolo11s-pose.xml' 
      --camera-id 'cam0,cam2,cam4,cam6' 
      --device 'GPU'
      --livestream 'true'
      "

  # Enhanced Universal Benchmark Monitor (Intel Arc Optimized)
  benchmark-monitor:
    image: python:3.9-slim
    container_name: benchmark_monitor
    volumes:
      - ./benchmark_results:/benchmark_results
      - ./benchmark_monitor.py:/app/benchmark_monitor.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev/dri:/dev/dri  # Intel GPU access for monitoring
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dlstreamer_shared_net
    restart: unless-stopped
    privileged: true
    environment:
      - KAFKA_BROKER=kafka:9092
      - PYTHONUNBUFFERED=1
      - LIBVA_DRIVER_NAME=iHD
      - GST_VAAPI_ALL_DRIVERS=1
    command: >
      bash -c "
      echo '========================================' &&
      echo '📊 Starting Benchmark Monitor' &&
      echo '========================================' &&
      apt-get update -qq && apt-get install -y -qq procps netcat-openbsd > /dev/null 2>&1 &&
      pip install -q kafka-python psutil docker &&
      echo '' &&
      echo '💻 System Hardware:' &&
      cat /proc/cpuinfo | grep 'model name' | head -1 | sed 's/model name.*: /  CPU: /' &&
      free -h | awk 'NR==2{printf \"  Memory: %s total, %s available\\n\", \$2, \$7}' &&
      echo '' &&
      echo '🔍 Starting performance monitoring...' &&
      echo '========================================' &&
      python /app/benchmark_monitor.py
      "

networks:
  dlstreamer_shared_net:
    external: true
